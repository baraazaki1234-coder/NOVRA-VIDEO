name: Android CI
on:
  push:
    branches: [release/novra-android-next]
  pull_request:
    branches: [release/novra-android-next]
  workflow_dispatch:

concurrency:
  group: novra-native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: novra-stable-debug-signing-v1
      - name: Create stable debug signing key if missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=NOVRA Debug,O=NOVRA,C=EG" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: novra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
