name: Viora Android build
run-name: Viora native validation and APK build

on:
  workflow_dispatch:
  push:
    branches:
      - release/novra-android-next
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/viora-android.yml'

permissions:
  contents: read

concurrency:
  group: viora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build Viora 1.0.7 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build native Android application
        run: gradle --no-daemon --stacktrace --console=plain assembleDebug

      - name: Verify APK package and checksum
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 10
          sha256sum "$APK" | tee app-debug.apk.sha256

      - name: Upload Viora APK
        uses: actions/upload-artifact@v4
        with:
          name: Viora-1.0.7-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
